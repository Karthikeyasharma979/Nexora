<svg width="1600" height="360" viewBox="0 0 1600 360" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Premium Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1118"/>
      <stop offset="1" stop-color="#171F2B"/>
    </linearGradient>

    <!-- Neon Accent -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5EE7FF"/>
      <stop offset="1" stop-color="#3A8DFF"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1600" height="360" rx="24" fill="url(#bg)"/>

  <!-- Decorative Glow -->
  <circle cx="1280" cy="40" r="180" fill="#1F5FFF" opacity="0.08"/>
  <circle cx="220" cy="320" r="150" fill="#5EE7FF" opacity="0.05"/>

  <!-- Futuristic Logo Symbol -->
  <g transform="translate(70,78)" filter="url(#shadow)">

    <!-- Outer Shape -->
    <path d="M0 78L78 30L138 62L60 110L0 78Z"
          fill="white"/>

    <!-- Inner Dynamic Layer -->
    <path d="M60 110L138 62L220 104L142 152L60 110Z"
          fill="url(#neon)"/>

    <!-- Left Depth -->
    <path d="M0 78V154L60 190V110L0 78Z"
          fill="#D9E3F0"/>

    <!-- Right Depth -->
    <path d="M142 152V232L220 188V104L142 152Z"
          fill="#57C8FF"/>

    <!-- Floating Highlight -->
    <rect x="115" y="16" width="80" height="10" rx="5"
          transform="rotate(-28 115 16)"
          fill="#8EF3FF"
          opacity="0.8"/>

  </g>

  <!-- Main Brand -->
  <text x="355"
        y="215"
        font-family="Poppins, Arial, sans-serif"
        font-size="165"
        font-weight="700"
        letter-spacing="-5"
        fill="white">
    Nexora
  </text>

  <!-- Tiny Premium Label -->
  <text x="365"
        y="258"
        font-family="Inter, Arial, sans-serif"
        font-size="28"
        letter-spacing="10"
        fill="#7D8DA6">
    DIGITAL SYSTEMS
  </text>

  <!-- Divider -->
  <line x1="980" y1="82"
        x2="980" y2="278"
        stroke="url(#neon)"
        stroke-width="3"
        opacity="0.8"/>

  <!-- sync -->
  <text x="1065"
        y="220"
        font-family="Poppins, Arial, sans-serif"
        font-size="145"
        font-weight="600"
        letter-spacing="-4"
        fill="#F8FBFF">
    sync
  </text>

  <!-- Smart Accent Underline -->
  <rect x="1068"
        y="245"
        width="240"
        height="7"
        rx="4"
        fill="url(#neon)"
        filter="url(#glow)"/>

  <!-- Right Floating UI Accent -->
  <g opacity="0.9">
    <circle cx="1460" cy="92" r="8" fill="#5EE7FF"/>
    <circle cx="1490" cy="122" r="5" fill="#3A8DFF"/>
    <circle cx="1442" cy="145" r="4" fill="white"/>
  </g>

</svg>
