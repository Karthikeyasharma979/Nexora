<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexora Secure Browser - Loading</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #0078D7;
      box-sizing: border-box;
    }
    
    .content-area {
      flex: 1;
      display: flex;
      padding: 30px;
      align-items: center;
    }
    
    .logo-container {
      flex: 0 0 150px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* Using SVG to mimic the globe with lock concept */
    .logo-svg {
      width: 120px;
      height: 120px;
    }
    
    .text-container {
      flex: 1;
      padding-left: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .app-title-container {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    
    .app-title-prefix {
      font-size: 42px;
      font-weight: 800;
      color: #F28C28; /* Orange similar to SEB */
      margin-right: 12px;
      letter-spacing: -1px;
    }
    
    .app-title-suffix {
      font-size: 20px;
      color: #0078D7; /* Blue */
      line-height: 1.1;
      font-weight: 400;
    }
    
    .app-version {
      font-size: 14px;
      color: #555555;
      margin-bottom: 20px;
    }
    
    .app-copyright {
      font-size: 12px;
      color: #777777;
      line-height: 1.4;
    }
    
    .footer-area {
      height: 30px;
      background-color: #e5e5e5;
      position: relative;
      display: flex;
      align-items: center;
    }
    
    .progress-bar {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background-color: #00A651; /* Green */
      width: 0%;
      transition: width 2.5s cubic-bezier(0.2, 0, 0.2, 1);
    }
    
    .status-text {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: #111111;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="content-area">
    <div class="logo-container">
      <img src="seb-logo.png" alt="SEB Logo" style="width: 120px; height: 120px; object-fit: contain;">
    </div>
    
    <div class="text-container">
      <div class="app-title-container">
        <div class="app-title-prefix">NEX</div>
        <div class="app-title-suffix">Nexora<br>Secure<br>Browser</div>
      </div>
      <div class="app-version">Version 1.0.1 (x64)</div>
      <div class="app-copyright">
        Copyright &copy; 2026 Nexora EduTech.<br>
        Educational Development and<br>
        Technology (LET)
      </div>
    </div>
  </div>
  
  <div class="footer-area">
    <div class="progress-bar" id="progressBar"></div>
    <div class="status-text" id="statusText">Verifying integrity</div>
  </div>

  <script>
    // Simulate the progress bar filling up over time
    window.onload = function() {
      const bar = document.getElementById('progressBar');
      const text = document.getElementById('statusText');
      
      // Start animation slightly after load
      setTimeout(() => {
        bar.style.width = '65%';
      }, 100);

      // Phase 2 of loading
      setTimeout(() => {
        bar.style.width = '85%';
        text.innerText = 'Applying security policies...';
      }, 1200);

      // We will listen for a message from the main process to complete it
      const { ipcRenderer } = require('electron');
      ipcRenderer.on('app-ready', () => {
        bar.style.width = '100%';
        text.innerText = 'Ready!';
      });
    }
  </script>
</body>
</html>
